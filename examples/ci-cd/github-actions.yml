name: Build and Upload Askdepth Component Map

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build & Upload Component Map
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Application (Next.js / Vite / Rspack)
        run: pnpm build
        env:
          NODE_ENV: production
          # Use Git Commit SHA as unique build identifier
          ASKDEPTH_BUILD_ID: ${{ github.sha }}

      - name: Upload Component Map to Askdepth
        run: npx askdepth-upload-map
        env:
          ASKDEPTH_API_KEY: ${{ secrets.ASKDEPTH_API_KEY }}
          ASKDEPTH_INGEST_URL: https://in.askdepth.com
          ASKDEPTH_BUILD_ID: ${{ github.sha }}
